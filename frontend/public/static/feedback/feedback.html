<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>意见反馈</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: 'Microsoft YaHei', sans-serif;
				color: #1f1f1f;
				background: #f7f8fa;
			}
			.wrap {
				padding: 16px;
			}
			.tabs {
				display: flex;
				gap: 8px;
				margin-bottom: 12px;
			}
			.tab {
				flex: 1;
				padding: 8px;
				text-align: center;
				border-radius: 6px;
				background: #fff;
				border: 1px solid #e5e6eb;
				cursor: pointer;
			}
			.tab.active {
				border-color: #1677ff;
				color: #1677ff;
				font-weight: 600;
			}
			.card {
				background: #fff;
				border-radius: 8px;
				padding: 16px;
				border: 1px solid #eee;
			}
			label {
				display: block;
				margin: 12px 0 6px;
				font-size: 13px;
				color: #666;
			}
			input,
			textarea,
			select {
				width: 100%;
				padding: 8px 10px;
				border: 1px solid #d9d9d9;
				border-radius: 6px;
				font-size: 14px;
			}
			textarea {
				min-height: 120px;
				resize: vertical;
			}
			input[readonly] {
				background: #f5f5f5;
			}
			.btn {
				margin-top: 16px;
				width: 100%;
				height: 40px;
				border: none;
				border-radius: 6px;
				background: #1677ff;
				color: #fff;
				font-size: 15px;
				cursor: pointer;
			}
			.tip {
				margin-top: 12px;
				padding: 10px 12px;
				background: #fff7e6;
				border: 1px solid #ffd591;
				border-radius: 6px;
				font-size: 12px;
				color: #ad6800;
				line-height: 1.6;
			}
			.muted {
				color: #999;
				font-size: 13px;
				text-align: center;
				padding: 24px 8px;
			}
			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<div class="tabs">
				<div class="tab active" data-tab="submit">提交反馈</div>
				<div class="tab" data-tab="mine">我的反馈</div>
			</div>
			<div id="pane-submit" class="card">
				<label>业务系统</label>
				<input id="sysName" readonly />
				<label>联系人</label>
				<input id="name" />
				<label>手机号</label>
				<input id="phone" />
				<label>所属模块</label>
				<input id="module" placeholder="请输入所属模块" />
				<label>反馈问题 *</label>
				<textarea id="content" placeholder="请描述问题或建议"></textarea>
				<button class="btn" id="submitBtn" type="button">提交</button>
				<div class="tip">
					当前为本地联调页。完整工单能力需反馈平台可达：请将
					<code>public/config.json</code> 中 <code>feedbackOpen.useLocalWidget</code> 设为
					<code>false</code>，并配置可访问的 <code>frontUrl</code> /
					<code>serverUrl</code>。
				</div>
			</div>
			<div id="pane-mine" class="card hidden">
				<div class="muted">本地联调模式暂无「我的反馈」列表，平台连通后由 iframe 页提供。</div>
			</div>
		</div>
		<script>
			function qs(key) {
				return new URLSearchParams(location.search).get(key) || ''
			}
			document.getElementById('sysName').value = qs('sysName') || qs('sysCode')
			document.getElementById('name').value = qs('name')
			document.getElementById('phone').value = qs('phone')

			document.querySelectorAll('.tab').forEach(function (el) {
				el.addEventListener('click', function () {
					document.querySelectorAll('.tab').forEach(function (t) {
						t.classList.remove('active')
					})
					el.classList.add('active')
					var tab = el.getAttribute('data-tab')
					document.getElementById('pane-submit').classList.toggle('hidden', tab !== 'submit')
					document.getElementById('pane-mine').classList.toggle('hidden', tab !== 'mine')
				})
			})

			document.getElementById('submitBtn').addEventListener('click', function () {
				var content = document.getElementById('content').value.trim()
				if (!content) {
					alert('请填写反馈问题')
					return
				}
				alert('本地联调页：已收集表单，但未提交到反馈平台。请配置可访问的平台地址后使用正式挂件。')
			})
		</script>
	</body>
</html>
